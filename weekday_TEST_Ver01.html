<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>預かり保育予約フォーム（平日版）</title>
    <style>
        /* holiday.html のトーンに合わせたスタイル */
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #e8f5e9; } /* 平日は緑系の背景 */
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; text-align: center; color: #2e7d32; margin: 10px 0; }
        .btn-back { display: inline-block; margin-bottom: 15px; color: #666; text-decoration: none; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        
        /* 操作種別（ボタン選択式）のスタイル */
        .mode-container { display: flex; gap: 10px; margin-top: 5px; }
        .mode-option { flex: 1; cursor: pointer; }
        .mode-option input { display: none; }
        .mode-label { display: block; padding: 12px 5px; text-align: center; background: #fff; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; font-weight: bold; color: #666; }
        .mode-option input:checked + .mode-label { background: #e8f5e9; border-color: #2e7d32; color: #2e7d32; }

        .btn-submit { width: 100%; padding: 15px; background: #4caf50; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:disabled { background: #ccc; }
        
        .note { font-size: 0.85em; color: #666; margin-top: 5px; }
        .iphone-notice { font-size: 0.85em; color: #d93025; margin-bottom: 5px; font-weight: bold; }
        #date-error { color: #d93025; font-weight: bold; display: none; margin-top: 5px; background: #fff5f5; padding: 10px; border-radius: 5px; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>

<div class="container">
<a href="index.html" class="btn-back">← ポータル画面へ戻る</a>
<h1>預かり保育予約 <span style="font-size:14px;color:#2e7d32;">[平日版 TEST]</span></h1>
<div id="date-error"></div>

<div class="form-group"><label>① 予約方法</label>
<div class="mode-container">
<label class="mode-option"><input type="radio" name="reservation_type" value="single" checked><span class="mode-label">日別予約</span></label>
<label class="mode-option"><input type="radio" name="reservation_type" value="bulk"><span class="mode-label">一括登録</span></label>
</div><p class="note">※一括登録は次段階で複数日選択に対応します。</p></div>

<div class="form-group"><label>② クラス</label>
<select id="class-select" onchange="updateStudentList()"><option value="">Googleから読み込み中...</option></select></div>

<div class="form-group"><label>③ 園児名</label>
<select id="student-select" disabled><option value="">クラスを先に選択してください</option></select>
<p class="note">※園児情報はGoogle側の非公開マスタから取得します。</p></div>

<div class="form-group"><label>④ 操作種別</label><div class="mode-container">
<label class="mode-option"><input type="radio" name="v_mode" value="新規" checked><span class="mode-label">新規</span></label>
<label class="mode-option"><input type="radio" name="v_mode" value="変更"><span class="mode-label">変更</span></label>
<label class="mode-option"><input type="radio" name="v_mode" value="取消"><span class="mode-label">取消</span></label>
</div></div>

<div class="form-group"><label>⑤ 利用希望日</label>
<p class="iphone-notice">※日付の枠内をタップして選択してください</p>
<input type="date" id="date-select" required onchange="validateDate()">
<p class="note">※締め切りは前日の15:30です。</p></div>

<div class="form-group"><label>⑥ 利用時間</label>
<select id="time-cost-select">
<option value="">選択してください</option>
<option value="15:00" data-time-code="WD_1500">～15:00</option>
<option value="16:30" data-time-code="WD_1630">～16:30</option>
<option value="17:00" data-time-code="WD_1700">16:30～17:00（時間外）</option>
<option value="18:00" data-time-code="WD_1800">16:30～18:00（時間外）</option>
</select><p class="note">※料金はGoogle側の料金表から判定する設計へ移行します。</p></div>

<div class="form-group"><label>⑦ お迎え・同伴</label>
<select id="pickup"><option value="母">母</option><option value="父">父</option><option value="その他">その他</option></select></div>

<div class="form-group"><label>⑧ その他（任意）</label><textarea id="memo" rows="2"></textarea></div>
<button class="btn-submit" onclick="handleConfirm()">送信する</button>
<p id="result" class="note"></p>
</div>

<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbxtlnMaz6YYzZsemByM8vn2YZidaLVdkO-64JIoHqbcF6zqohFcLFaXsnO-UwZ5Gp1k/exec';
let studentData={}, holidays=[];

window.onload=async()=>{ await init(); };

async function init(){
 try{
  const ts=Date.now();
  const resH=await fetch(`data/calendar/holidays.json?v=${ts}`);
  holidays=await resH.json();

  const res=await fetch(`${WEB_APP_URL}?action=children`);
  const result=await res.json();
  if(result.status!=="success" || !Array.isArray(result.children))
    throw new Error(result.message || "園児マスタを取得できませんでした");

  result.children.forEach(c=>{
   const cls=c.class_name || c.class || "";
   if(!cls) return;
   if(!studentData[cls]) studentData[cls]=[];
   studentData[cls].push({id:c.child_id,name:c.name});
  });

  const cs=document.getElementById('class-select');
  cs.innerHTML='<option value="">選択してください</option>';
  Object.keys(studentData).sort().forEach(cls=>cs.add(new Option(cls,cls)));

  const d=document.getElementById('date-select');
  d.min=new Date().toISOString().split('T')[0];
 }catch(e){
  document.getElementById('class-select').innerHTML='<option value="">読み込みに失敗しました</option>';
  alert("初期データの読み込みに失敗しました。\\n\\n"+e.message);
 }
}

function updateStudentList(){
 const cls=document.getElementById('class-select').value;
 const ss=document.getElementById('student-select');
 ss.innerHTML='<option value="">選択してください</option>';
 if(cls && studentData[cls]){
  studentData[cls].forEach(s=>ss.add(new Option(s.name,s.id)));
  ss.disabled=false;
 }else ss.disabled=true;
}

function validateDate(){
 const d=document.getElementById('date-select'), e=document.getElementById('date-error');
 e.style.display="none"; if(!d.value)return;
 const h=holidays.includes(d.value)||holidays.includes(d.value.replace(/-/g,'/'));
 if(h){e.innerHTML='⚠️ 選択された日は休暇期間です。<br><a href="holiday.html" style="color:blue;">[休暇版フォームはこちら]</a>';e.style.display="block";d.value="";return;}
 const now=new Date(), limit=new Date(d.value); limit.setDate(limit.getDate()-1);limit.setHours(15,30,0,0);
 if(now>limit){e.innerText="⚠️ 前日15:30を過ぎているため、園まで直接お電話ください。";e.style.display="block";d.value="";}
}

async function handleConfirm(){
 const rt=document.querySelector('input[name="reservation_type"]:checked').value;
 if(rt==="bulk"){alert("一括登録は次段階で実装します。今回は日別予約を選択してください。");return;}
 const cls=document.getElementById('class-select').value;
 const ss=document.getElementById('student-select');
 const date=document.getElementById('date-select').value;
 const ts=document.getElementById('time-cost-select');
 if(!cls||!ss.value||!date||!ts.value){alert("未入力の項目があります。");return;}
 const data={
  reservation_type:rt, child_id:ss.value,
  mode:document.querySelector('input[name="v_mode"]:checked').value,
  date:date, end_time:ts.value,
  time_code:ts.options[ts.selectedIndex]?.dataset.timeCode||"",
  pickup:document.getElementById('pickup').value,
  memo:document.getElementById('memo').value.trim()
 };
 if(!confirm(`${ss.options[ss.selectedIndex].text}\\n${date} / ${ts.options[ts.selectedIndex].text}\\n${data.mode}として送信しますか？`))return;
 const btn=document.querySelector('.btn-submit'); btn.disabled=true;btn.innerText="送信中...";
 try{
  const r=await fetch(WEB_APP_URL,{method:'POST',body:JSON.stringify(data)});
  const result=await r.json();
  if(result.status!=="success")throw new Error(result.message||"予約処理に失敗しました");
  alert(result.message||"予約を受け付けました。");
 }catch(e){alert("送信に失敗しました。\\n\\n"+e.message);}
 finally{btn.disabled=false;btn.innerText="送信する";}
}
</script>
</body>
</html>
